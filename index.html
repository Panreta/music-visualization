<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Visualizer</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="grain" class="grain"></div>

  <div id="hint" class="hint">
    <h1>Music Visualizer</h1>
    <p>Drop an MP3 anywhere, or press <strong>Choose MP3</strong> below.</p>
    <p class="sub">Sit back. Click or drag on the screen to make ripples.</p>
  </div>

  <div id="modelLabel" class="model-label">
    <div id="modelText" class="model-text" aria-live="polite"></div>
    <button id="modelBtn" class="model-refresh" title="Another equation (M)" aria-label="Another equation">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>

  <div id="dropOverlay" class="drop-overlay"><span>Drop to play</span></div>

  <div id="controls" class="controls">
    <label class="btn file-btn" title="Choose an audio file">
      <input id="fileInput" type="file" accept="audio/*,.mp3" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      <span>Choose MP3</span>
    </label>

    <button id="playBtn" class="btn icon" disabled aria-label="Play">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path id="playIcon" fill="currentColor" d="M8 5v14l11-7z"/></svg>
    </button>

    <div class="track">
      <div id="trackName" class="track-name">No track loaded</div>
      <div class="seek-row">
        <span id="curTime" class="time">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" disabled aria-label="Seek">
        <span id="durTime" class="time">0:00</span>
      </div>
    </div>

    <button id="sceneBtn" class="btn" title="Switch background (S)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1z"/></svg>
      <span>Scene</span>
    </button>

    <button id="barsBtn" class="btn toggle active" aria-pressed="true" title="Show or hide bars (B)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 20h3V10H4zm6.5 0h3V4h-3zM17 20h3v-7h-3z"/></svg>
      <span>Bars</span>
    </button>

    <label class="volume" title="Volume">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </label>
  </div>

  <script src="app.js?v=15"></script>
</body>
</html>
